<!DOCTYPE html>
<!--
  seed-firestore.html
  ═══════════════════
  ONE-TIME USE ONLY. Run this locally to populate Firestore with the
  existing data from script.js. Delete this file after seeding.

  How to use:
  1. Create a .env.local file in the project root with your Firebase values:
       FIREBASE_API_KEY=AIzaSy...
       FIREBASE_AUTH_DOMAIN=bhadra-cricket.firebaseapp.com
       FIREBASE_PROJECT_ID=bhadra-cricket
       FIREBASE_STORAGE_BUCKET=bhadra-cricket.appspot.com
       FIREBASE_MESSAGING_SENDER_ID=123456789
       FIREBASE_APP_ID=1:123:web:abc123
  2. Run:  npx serve .   then open http://localhost:3000/seed-firestore.html
  3. Click "Seed Firestore" and sign in with your allowed Google account
  4. Watch the log — it should end with "🎉 All done!"
  5. Verify data in Firebase Console → Firestore
  6. DELETE this file from the repo — it is not needed after seeding

  NOTE: .env.local is in .gitignore — your real credentials never get committed.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seed Firestore — One Time Use</title>
  <style>
    body { font-family: monospace; background: #0a1628; color: #e8edf4; padding: 2rem; }
    button { background: #1a6fff; color: white; border: none; padding: 12px 24px;
             border-radius: 8px; font-size: 1rem; cursor: pointer; margin-bottom: 1rem; }
    button:disabled { background: #2a4060; color: #4a6080; cursor: not-allowed; }
    #log { background: #0d1b2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
           padding: 1rem; white-space: pre-wrap; font-size: 0.85rem; min-height: 200px;
           max-height: 600px; overflow-y: auto; }
    .ok  { color: #00c9a7; }
    .err { color: #ff5050; }
  </style>
</head>
<body>
<!-- Load config from .env.local via a tiny Node script run at serve time.
     If window.__ENV__ is not set, show a friendly error instead of a cryptic crash. -->
<script>
if (!window.__ENV__ || !window.__ENV__.FIREBASE_API_KEY) {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('seedBtn').disabled = true;
    document.getElementById('log').innerHTML =
      '<span style="color:#ff5050">⚠️  Firebase config not loaded.\n\n' +
      'Run this file through the env-inject script:\n\n' +
      '  node inject-env-seed.js   (then open the output in your browser)\n\n' +
      'OR use the manual steps in the comment at the top of this file.</span>';
  });
}
</script>
<h2>🌱 Seed Firestore — One Time Use</h2>
<p style="color:#7a9bb8;margin-bottom:1rem">
  This will populate Firestore with all existing cricket stats. Run once, then delete this file.
</p>
<button id="seedBtn" onclick="seed()">Seed Firestore</button>
<pre id="log">Click the button above to start...</pre>

<script type="module">
import { initializeApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, writeBatch, collection }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithPopup, GoogleAuthProvider }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ── FIREBASE CONFIG ──────────────────────────────────────────────────────────
// Values come from .env.local via the inline <script> block above.
// DO NOT paste real values here — keep this file safe to commit.
const firebaseConfig = {
  apiKey:            window.__ENV__.FIREBASE_API_KEY,
  authDomain:        window.__ENV__.FIREBASE_AUTH_DOMAIN,
  databaseURL:       window.__ENV__.FIREBASE_DATABASE_URL,
  projectId:         window.__ENV__.FIREBASE_PROJECT_ID,
  storageBucket:     window.__ENV__.FIREBASE_STORAGE_BUCKET,
  messagingSenderId: window.__ENV__.FIREBASE_MESSAGING_SENDER_ID,
  appId:             window.__ENV__.FIREBASE_APP_ID,
  measurementId:     window.__ENV__.FIREBASE_MEASUREMENT_ID,
};
// ────────────────────────────────────────────────────────────────────────────

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);
const log  = document.getElementById('log');

function write(msg, cls = '') {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = msg + '\n';
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

// ── DATA ─────────────────────────────────────────────────────────────────────

const CAREER_DATA = {
  matches: 176, innings: 155, notOuts: 64, runs: 2223,
  avg: 24.43, sr: 65.69, hs: 90, fifties: 8,
  twentyFives: 21, ducks: 15, fours: 180, sixes: 1,
  overs: '109.1', wickets: 13, econ: 5.96, bowlAvg: 50.08,
  catches: 48, tournaments: 20, wides: 143, bowlInnings: 49,
};

// order field controls display order in the portfolio
const TOURNAMENTS_DATA = [
  { id:'dycl',    order:1,  name:'Dallas Youth Cricket League (DYCL Official)',   format:'YOUTH/1DAY',       matches:12, runs:197,  avg:21.89, sr:59.34, hs:87, fifties:1, wkts:0, econ:9.00,  catches:10 },
  { id:'csa',     order:2,  name:'Cricket of San Antonio',                        format:'1DAY/T20',         matches:48, runs:391,  avg:13.96, sr:48.94, hs:50, fifties:1, wkts:6, econ:6.75,  catches:8  },
  { id:'htbc',    order:3,  name:'Houston Taped Ball Cricket',                    format:'T20',              matches:2,  runs:8,    avg:null,  sr:42.11, hs:8,  fifties:0, wkts:0, econ:null,  catches:0  },
  { id:'nyct',    order:4,  name:'National Youth Cricket Tournament',             format:'1DAY',             matches:7,  runs:192,  avg:48.00, sr:81.36, hs:59, fifties:2, wkts:0, econ:null,  catches:0  },
  { id:'acl',     order:5,  name:'American Cricket League',                       format:'T20/1DAY',         matches:10, runs:66,   avg:16.50, sr:45.83, hs:21, fifties:0, wkts:0, econ:10.0,  catches:1  },
  { id:'ayl',     order:6,  name:'Austin Youth League',                           format:'YOUTH',            matches:4,  runs:50,   avg:50.00, sr:79.37, hs:48, fifties:0, wkts:0, econ:null,  catches:0  },
  { id:'fycl',    order:7,  name:'Frisco Youth Cricket League',                   format:'1DAY',             matches:3,  runs:33,   avg:16.50, sr:53.23, hs:19, fifties:0, wkts:0, econ:null,  catches:0  },
  { id:'matches', order:8,  name:'The Matches',                                   format:'1DAY',             matches:1,  runs:10,   avg:10.00, sr:28.57, hs:10, fifties:0, wkts:0, econ:null,  catches:0  },
  { id:'ntca',    order:9,  name:'NTCAYouth',                                     format:'1DAY',             matches:4,  runs:0,    avg:null,  sr:null,  hs:0,  fifties:0, wkts:0, econ:12.0,  catches:0  },
  { id:'mlk',     order:10, name:'MLK JR Texas Cup',                              format:'1DAY/T20',         matches:8,  runs:147,  avg:29.40, sr:73.13, hs:67, fifties:1, wkts:0, econ:3.00,  catches:3  },
  { id:'usacjp',  order:11, name:'USA Cricket Junior Pathway',                    format:'T20/1DAY',         matches:31, runs:497,  avg:38.23, sr:84.38, hs:90, fifties:1, wkts:4, econ:2.20,  catches:12 },
  { id:'acltest', order:12, name:'ACL Test Series',                               format:'TEST',             matches:1,  runs:3,    avg:3.00,  sr:13.64, hs:2,  fifties:0, wkts:1, econ:3.00,  catches:0  },
  { id:'lpcl',    order:13, name:'Lonestar Premier Cricket League (LPCL)',        format:'1DAY',             matches:3,  runs:5,    avg:1.67,  sr:20.83, hs:5,  fifties:0, wkts:1, econ:6.50,  catches:0  },
  { id:'typl',    order:14, name:'TexasYouthPremierLeague',                       format:'ZERO',             matches:0,  runs:0,    avg:null,  sr:null,  hs:0,  fifties:0, wkts:0, econ:null,  catches:0  },
  { id:'amlca',   order:15, name:'AMLCA - Elite Jr Championship',                 format:'1DAY',             matches:8,  runs:46,   avg:6.57,  sr:46.00, hs:13, fifties:0, wkts:0, econ:null,  catches:2  },
  { id:'prez',    order:16, name:'Presidents Cup',                                format:'T20',              matches:8,  runs:86,   avg:17.20, sr:100.0, hs:8,  fifties:0, wkts:1, econ:6.17,  catches:1  },
  { id:'22yards', order:17, name:'22Yards League',                                format:'ZERO',             matches:0,  runs:0,    avg:null,  sr:null,  hs:0,  fifties:0, wkts:0, econ:null,  catches:0  },
  { id:'aeycl',   order:18, name:'Austin Elite Youth Cricket League',             format:'T20',              matches:9,  runs:224,  avg:74.67, sr:77.78, hs:50, fifties:2, wkts:0, econ:7.20,  catches:2  },

const YEARLY_DATA = [
  {
    year: 2024, matches: 22, innings: 18, notOuts: 7, runs: 207, balls: 356,
    avg: 18.82, sr: 58.15, hs: 57, fifties: 1, twentyFives: 2, ducks: 3,
    fours: 8, sixes: 0, wickets: 0, catches: 1,
    overs: '9.0', runsConc: 80, econ: 8.89, tournaments: 5,
    tournamentNames: ['DYCL','NYCT','ACL','Austin Youth','USAC'],
  },
  {
    year: 2025, matches: 33, innings: 30, notOuts: 11, runs: 385, balls: 501,
    avg: 20.26, sr: 76.85, hs: 59, fifties: 1, twentyFives: 1, ducks: 4,
    fours: 28, sixes: 0, wickets: 0, catches: 8,
    overs: '2.7', runsConc: 7, econ: 2.63, tournaments: 10,
    tournamentNames: ['DYCL','NYCT','ACL','Frisco YCL','The Matches','MLK Cup','AMLCA','Presidents Cup','Austin Consortium','HIT'],
  },
  {
    year: 2026, matches: 54, innings: 46, notOuts: 20, runs: 1054, balls: 1088,
    avg: 40.54, sr: 96.88, hs: 90, fifties: 3, twentyFives: 15, ducks: 4,
    fours: 103, sixes: 1, wickets: 0, catches: 7,
    overs: '1.0', runsConc: 17, econ: 17.00, tournaments: 5,
    tournamentNames: ['DYCL','MLK Cup','USAC','Presidents Cup','Austin Consortium'],
  },
];

// ── SEED ─────────────────────────────────────────────────────────────────────

window.seed = async () => {
  const btn = document.getElementById('seedBtn');
  btn.disabled = true;
  log.innerHTML = '';

  write('Signing in with Google...');
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
    write('✓ Signed in', 'ok');
  } catch (e) {
    write('✗ Sign-in failed: ' + e.message, 'err');
    btn.disabled = false;
    return;
  }

  // 1 — career summary
  write('\nSeeding career summary...');
  try {
    await setDoc(doc(db, 'meta', 'career'), CAREER_DATA);
    write('✓ meta/career written', 'ok');
  } catch (e) {
    write('✗ ' + e.message, 'err');
  }

  // 2 — tournaments (batched, 20 docs)
  write('\nSeeding tournaments (20 docs)...');
  try {
    // Firestore batch limit is 500 ops — 20 docs is fine in one batch
    const batch = writeBatch(db);
    for (const t of TOURNAMENTS_DATA) {
      const { id, ...data } = t;
      // Remove null values — Firestore stores them but cleaner without
      const clean = Object.fromEntries(
        Object.entries(data).filter(([, v]) => v !== null)
      );
      batch.set(doc(db, 'tournaments', id), clean);
    }
    await batch.commit();
    write(`✓ ${TOURNAMENTS_DATA.length} tournament docs written`, 'ok');
  } catch (e) {
    write('✗ ' + e.message, 'err');
  }

  // 3 — yearly stats (3 docs)
  write('\nSeeding yearly stats (3 docs)...');
  try {
    const batch = writeBatch(db);
    for (const y of YEARLY_DATA) {
      batch.set(doc(db, 'yearly', String(y.year)), y);
    }
    await batch.commit();
    write('✓ 3 yearly docs written', 'ok');
  } catch (e) {
    write('✗ ' + e.message, 'err');
  }

  write('\n🎉 All done! Verify data in Firebase Console → Firestore.');
  write('Then DELETE this file from the repo — it is not needed anymore.', 'err');
  btn.disabled = false;
};
</script>
</body>
</html>
